<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Stamp Rally — offline</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f8;
    --panel: #ffffff;
    --text: #17171a;
    --muted: #6b7280;
    --border: #e5e7eb;
    --accent: #2563eb;
    --accent-text: #ffffff;
    --danger: #b42318;
    --danger-bg: #fef3f2;
    --notice-bg: #eff6ff;
    --notice-text: #1e40af;
    --badge-open: #eef2ff;
    --badge-open-text: #3730a3;
    --badge-mine: #ecfdf5;
    --badge-mine-text: #065f46;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111113;
      --panel: #1b1b1e;
      --text: #f2f2f3;
      --muted: #9ca3af;
      --border: #2d2d31;
      --notice-bg: #10233f;
      --notice-text: #bfdbfe;
      --badge-open: #1e1b4b;
      --badge-open-text: #c7d2fe;
      --badge-mine: #052e2b;
      --badge-mine-text: #6ee7b7;
      --danger-bg: #2a1414;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  #app { max-width: 640px; margin: 0 auto; padding: 24px 16px 64px; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .row { display: flex; flex-direction: row; align-items: flex-end; flex-wrap: wrap; gap: 12px; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
  }
  .panel.error { background: var(--danger-bg); color: var(--danger); border-color: var(--danger); }
  .panel.notice { background: var(--notice-bg); color: var(--notice-text); }
  .panel.header { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 12px; }
  h2 { margin: 0 0 4px; font-size: 16px; }
  .code { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 20px; letter-spacing: 0.05em; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); flex: 1; }
  input, select, textarea {
    font: inherit;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    resize: vertical;
  }
  textarea { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 12px; }
  button {
    font: inherit;
    padding: 8px 14px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: var(--accent-text);
    cursor: pointer;
  }
  button.secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
  .muted { color: var(--muted); font-size: 13px; }
  .badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
  }
  .badge.admin { background: var(--accent); color: var(--accent-text); }
  .badge.open { background: var(--badge-open); color: var(--badge-open-text); }
  .badge.mine { background: var(--badge-mine); color: var(--badge-mine-text); }
  .stall-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .stall-row:last-child { border-bottom: none; }
  .stall-name { font-weight: 600; }
</style>
</head>
<body>
<div id="app"><div class="panel">Loading…</div></div>
<script type="module" src="./app.js"></script>
</body>
</html>
